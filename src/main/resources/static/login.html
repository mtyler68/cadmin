<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadmin · Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/cadmin.css" rel="stylesheet">
</head>
<body class="login-body">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-7 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5 login-card">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="p-5">
                                <div class="text-center mb-4">
                                    <div class="login-brand mb-3"><i class="bi bi-heart-pulse-fill"></i></div>
                                    <h1 class="h4 text-gray-900 mb-1">Cadmin</h1>
                                    <p class="text-muted small mb-0">Clinical administration gateway</p>
                                </div>
                                <div id="login-alert" class="alert d-none" role="alert"></div>
                                <form id="local-login-form" class="d-none user">
                                    <div class="mb-3">
                                        <input type="text" class="form-control form-control-user" id="username"
                                               name="username" placeholder="Username" autocomplete="username" required>
                                    </div>
                                    <div class="mb-3">
                                        <input type="password" class="form-control form-control-user" id="password"
                                               name="password" placeholder="Password" autocomplete="current-password" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-user w-100" id="login-submit">
                                        Sign in
                                    </button>
                                    <div class="text-center mt-3">
                                        <small class="text-muted">Default users: admin / admin, clinician / clinician</small>
                                    </div>
                                </form>
                                <div id="oidc-login" class="d-none text-center">
                                    <p class="text-muted">Sign in with your organization identity provider.</p>
                                    <a class="btn btn-primary btn-user w-100" id="oidc-login-link" href="/oauth2/authorization/keycloak">
                                        <i class="bi bi-shield-lock me-2"></i>Continue with Keycloak
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/api.js"></script>
<script>
    $(function () {
        const params = new URLSearchParams(window.location.search);
        if (params.has("error")) {
            CadminApi.showAlert("#login-alert", "danger", "Sign in failed. Check your credentials and try again.");
        } else if (params.has("logout")) {
            CadminApi.showAlert("#login-alert", "success", "You have been signed out.");
        }

        CadminApi.get("/api/auth/config").done(function (config) {
            if (config.mode === "oidc") {
                $("#oidc-login").removeClass("d-none");
                if (config.oidcLoginUrl) {
                    $("#oidc-login-link").attr("href", config.oidcLoginUrl);
                }
            } else {
                $("#local-login-form").removeClass("d-none");
            }
        }).fail(function () {
            $("#local-login-form").removeClass("d-none");
        });

        $("#local-login-form").on("submit", function (event) {
            event.preventDefault();
            const $button = $("#login-submit").prop("disabled", true).text("Signing in…");
            CadminApi.login($("#username").val(), $("#password").val())
                .done(function () {
                    window.location.href = "/";
                })
                .fail(function (xhr) {
                    const message = xhr.status === 403
                        ? "Sign in was blocked (CSRF). Refresh the page and try again."
                        : "Sign in failed. Check your credentials and try again.";
                    CadminApi.showAlert("#login-alert", "danger", message);
                    $button.prop("disabled", false).text("Sign in");
                });
        });
    });
</script>
</body>
</html>
